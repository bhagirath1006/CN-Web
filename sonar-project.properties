sonar.projectKey=cloudnexus-web
sonar.projectName=CloudNexus Web
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source code
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.css

# Code analysis
sonar.qualitygate.wait=true
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
