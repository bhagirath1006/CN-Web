name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/cloudnexus-web:$IMAGE_TAG .

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag $ECR_REGISTRY/cloudnexus-web:$IMAGE_TAG $ECR_REGISTRY/cloudnexus-web:latest
          docker push $ECR_REGISTRY/cloudnexus-web:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloudnexus-web:latest

      # ===============================
      # DEPLOYMENT STARTS HERE
      # ===============================

      - name: Get EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=cloudnexus-web-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 instance
        run: |
          aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "cd /home/ubuntu/app",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 360477615168.dkr.ecr.us-east-1.amazonaws.com",
              "docker compose pull",
              "docker compose down",
              "docker compose up -d"
            ]' \
            --region us-east-1
